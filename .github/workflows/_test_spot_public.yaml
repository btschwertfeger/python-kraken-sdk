# Template workflow to test the public Spot endpoints
# of the python-kraken-sdk.
# Runs tests for:
#   * Spot REST clients
#

name: Test Spot

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      python-version:
        type: string
        required: true
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  Test-Spot:
    name: Test ${{ inputs.os }} ${{ inputs.python-version }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 5
    env:
      OS: ${{ inputs.os }}
      PYTHON: ${{ inputs.python-version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.codecov.io:443
            api.github.com:443
            api.kraken.com:443
            cli.codecov.io:443
            files.pythonhosted.org:443
            github.com:443
            ingest.codecov.io:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            ws.kraken.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the built wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install package (Linux or macOS)
        if: runner.os != 'Windows'
        run: |
          uv venv
          source .venv/bin/activate
          echo ${GITHUB_WORKSPACE}/.venv/bin >> $GITHUB_PATH
          uv pip install "$(find dist -name '*.whl' | head -1)[mcp]" -r requirements-dev.txt

      - name: Install package (Windows)
        if: runner.os == 'Windows'
        run: |
          uv venv
          .venv\Scripts\activate.ps1
          echo "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $wheel = (Get-ChildItem -Path dist -Filter "*.whl" | Select-Object -First 1).FullName
          uv pip install "$wheel[mcp]" -r requirements-dev.txt

      - name: Testing Spot REST endpoints
        run: >
          pytest -vv -x -n auto -m "spot and not spot_auth and not spot_websocket"
          --cov=kraken --cov-append --cov-report=
          --junitxml=junit-spot-public-rest.xml -o junit_family=legacy tests

      - name: Testing Spot websocket endpoints
        run: >
          pytest -vv -x -n auto -m "spot and not spot_auth and spot_websocket"
          --cov=kraken --cov-append --cov-report=xml:coverage.xml
          --junitxml=junit-spot-public-ws.xml -o junit_family=legacy tests

      - name: Upload coverage to Codecov
        if: runner.os != 'Windows' && github.actor == 'btschwertfeger'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: spot-public
          env_vars: OS,PYTHON
          fail_ci_if_error: false
          report_type: coverage
          name: codecov-umbrella

      - name: Upload test results to Codecov
        if: runner.os != 'Windows' && github.actor == 'btschwertfeger'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-spot-public-rest.xml,junit-spot-public-ws.xml
          flags: spot-public
          env_vars: OS,PYTHON
          fail_ci_if_error: false
          report_type: test_results
          name: codecov-umbrella
